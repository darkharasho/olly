[package]
name = "olly"
version = "0.2.5"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
libc = "0.2"
notify-rust = "4.18.2"
minisign-verify = "0.2"
sha2 = "0.10"
semver = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
